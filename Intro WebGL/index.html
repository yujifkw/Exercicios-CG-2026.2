<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Intro WebGL</title>
    <style>
        /* Estilos globais e tipografia */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff; 
            color: #000000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative; 
            overflow-x: hidden;
        }
        
        /* Logo no Canto Superior Esquerdo */
        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
        }

        .logo::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #000;
        }

        /* Contêiner das formas */
        .canvas-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 40px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #000000;
            font-size: 1.2em;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Canvas com borda sólida e sombra flat */
        canvas { 
            border: 2px solid #000000; 
            background-color: #000000; 
            box-shadow: 15px 15px 0px rgba(0,0,0,0.03); 
        }

        /* Rodapé no Canto Inferior Direito */
        footer { 
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 10px; 
            color: #000000; 
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Título posicionado no canto -->
    <div class="logo">Intro WebGL</div>

    <!-- Elementos centrais -->
    <div class="canvas-container">
        <div class="card">
            <h3>Flor</h3>
            <canvas id="glCanvas1" width="300" height="300"></canvas>
        </div>
        
        <div class="card">
            <h3>Robô</h3>
            <canvas id="glCanvas2" width="300" height="300"></canvas>
        </div>

        <div class="card">
            <h3>Carro</h3>
            <canvas id="glCanvas3" width="300" height="300"></canvas>
        </div>
    </div>

    <!-- Créditos posicionados no canto -->
    <footer>
        Desenvolvido por Lucas Yuji Sapia Furukawa [RA: 176581]
    </footer>

    <!-- Scripts -->
    <script src="flor.js"></script>
    <script src="robo.js"></script>
    <script src="carro.js"></script>

</body>
</html>
