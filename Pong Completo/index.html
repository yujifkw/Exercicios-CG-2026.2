<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong Completo</title>
    <style>
        /* Estilos globais e tipografia baseada no template Minimal White */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff; 
            color: #000000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center; /* Centraliza o jogo verticalmente */
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden; 
            position: relative; /* Garante que os elementos absolutos fiquem relativos à tela */
        }
        
        /* Logo no Canto Superior Esquerdo (Estilo Tooplate) */
        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
        }

        .logo::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #000;
        }

        /* Placar */
        .scoreboard {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.5em;
            font-weight: 300;
            letter-spacing: -1px;
            color: #000000;
            margin-bottom: 40px;
        }
        
        /* Contêiner principal do jogo */
        .game-area { 
            display: flex; 
            gap: 50px; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* Canvas com borda sólida marcante */
        canvas { 
            border: 2px solid #000000; 
            background-color: #000000; 
            box-shadow: 15px 15px 0px rgba(0,0,0,0.03); 
        }
        
        /* Estilização Visual das Teclas (Flat Design) */
        .keyboard-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .key-row {
            display: flex;
            gap: 12px;
        }

        .key-cap {
            width: 50px;
            height: 50px;
            background-color: #ffffff;
            border: 2px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
            font-size: 1.2em;
            font-weight: bold;
            color: #000000; 
            box-shadow: 3px 3px 0px #000000;
        }

        .key-cap.empty {
            visibility: hidden; 
        }

        /* Rodapé no Canto Inferior Direito */
        footer { 
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 10px; 
            color: #000000; 
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Título posicionado no canto -->
    <div class="logo">Pong Completo</div>

    <!-- Elementos centrais -->
    <div class="scoreboard" id="score-display">0 x 0</div>

    <div class="game-area">
        <!-- Controles Jogador 1 (Esquerda) -->
        <div class="keyboard-group">
            <div class="key-row">
                <div class="key-cap empty"></div>
                <div class="key-cap">W</div>
                <div class="key-cap empty"></div>
            </div>
            <div class="key-row">
                <div class="key-cap">A</div>
                <div class="key-cap">S</div>
                <div class="key-cap">D</div>
            </div>
        </div>

        <br></br>

        <!-- Canvas -->
        <canvas id="canvas" width="450" height="450"></canvas>

        <br></br>
        
        <!-- Controles Jogador 2 (Direita) -->
        <div class="keyboard-group">
            <div class="key-row">
                <div class="key-cap empty"></div>
                <div class="key-cap">↑</div>
                <div class="key-cap empty"></div>
            </div>
            <div class="key-row">
                <div class="key-cap">←</div>
                <div class="key-cap">↓</div>
                <div class="key-cap">→</div>
            </div>
        </div>
    </div>

    <!-- Créditos posicionados no canto -->
    <footer>
        Desenvolvido por Lucas Yuji Sapia Furukawa [RA: 176581]
    </footer>

    <!-- Scripts -->
    <script src="transformacoes.js"></script>
    <script src="main.js"></script>

</body>
</html>
