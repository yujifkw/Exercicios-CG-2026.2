<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Exercício - Helicóptero</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
        }

        .logo::after {
            content: '';
            position: absolute;
            right: -15px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #000;
        }

        .canvas-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 40px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #000000;
            font-size: 1.2em;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        canvas {
            border: 2px solid #000000;
            background-color: #000000;
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.03);
        }

        footer {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 10px;
            color: #000000;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="logo">Helicóptero</div>

    <div class="canvas-container">
        <div class="card">
            <h3>Helicóptero (WASD)</h3>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
    </div>

    <footer>
        Desenvolvido por Lucas Yuji Sapia Furukawa [RA: 176581]
    </footer>

    <script src="m4.js"></script>
    <script src="helicopterGeometry.js"></script>
    <script src="renderer.js"></script>
    <script src="sceneObject.js"></script>
    <script src="scene.js"></script>
    <script src="main.js"></script>

</body>

</html>
